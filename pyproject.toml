[project]
name = "quant-jp"
version = "0.1.0"
description = "日本株 分析・売買シグナル生成システム（J-Quants ベース / スイング中心 / レジーム現金化オーバーレイ）"
requires-python = ">=3.12"
dependencies = [
    "jquants-api-client>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "google-genai>=0.8",
    "keyring>=25.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_jp"]

[tool.ruff]
line-length = 100
target-version = "py312"
