name: daily-paper-trade

# 平日の場引け後（JST 16:30 = UTC 07:30）に自動実行。手動実行も可。
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # 台帳 commit 用
  pages: write      # GitHub Pages デプロイ用
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: uv セットアップ
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: uv sync

      # venv の python を直接使う（uv run は PYTHONPATH を無視するため）。
      # PYTHONPATH=src で src レイアウトを確実に解決。
      - name: 実行環境の設定
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          echo "PY=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"

      - name: import 動作確認
        run: $PY -c "import quant_jp.data.ingest; print('quant_jp import OK')"

      # 過年度の重いデータ（parquet）はキャッシュで持ち回る（毎回フル取得しない）
      - name: データキャッシュ復元
        uses: actions/cache@v4
        with:
          path: data
          key: jquants-data-${{ github.run_id }}
          restore-keys: |
            jquants-data-

      - name: 初回データ取得（キャッシュが空のときだけ）
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ ! -d data/daily_quotes ] || [ -z "$(ls -A data/daily_quotes 2>/dev/null)" ]; then
            # Standard プランはローリング10年。境界ちょうどは400になるため少し余裕(10年+7日後)
            START=$(date -d "10 years ago +7 days" +%Y-%m-%d)
            MSTART=$(date -d "10 years ago +1 month" +%Y-%m-01)
            echo "データ未取得 → 初回フル取得（${START} 〜, 数十分）"
            $PY -m quant_jp.data.ingest pull "$START" "$(date +%Y-%m-%d)"
            $PY -m quant_jp.data.ingest listed_history "$MSTART" "$(date +%Y-%m-01)"
          else
            echo "キャッシュあり → 増分更新のみ"
          fi

      - name: 増分更新（当年データ）
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: $PY -m quant_jp.data.ingest update

      - name: ペーパートレード台帳更新
        run: $PY -m quant_jp.ops.paper_trade

      - name: 静的ダッシュボード生成
        run: $PY -m quant_jp.dashboard.build_static

      - name: 台帳を commit（変化があれば）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/paper_ledger.csv || true
          git diff --cached --quiet || git commit -m "chore: ペーパー台帳更新 $(date +%Y-%m-%d)"
          git push || true

      - name: Pages 用アーティファクト
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
